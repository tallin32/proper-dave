[project]
name = "proper-dave"
version = "0.1.0"
description = "Proper Dave — an absurdly customizable AI visual interpreter (MVP server + classifier harness)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn>=0.30",
]

[project.scripts]
proper-dave-server = "proper_dave.server:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proper_dave"]

[tool.pytest.ini_options]
testpaths = ["tests"]
